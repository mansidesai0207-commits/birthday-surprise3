
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <!-- Your Canva design -->
        <img src="page1.png" class="design" alt="Birthday secret code page">

        <!-- Four password indicators -->
        <div class="dots" id="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Real clickable keypad -->
        <div class="keypad">
            <button data-number="1" aria-label="1"></button>
            <button data-number="2" aria-label="2"></button>
            <button data-number="3" aria-label="3"></button>

            <button data-number="4" aria-label="4"></button>
            <button data-number="5" aria-label="5"></button>
            <button data-number="6" aria-label="6"></button>

            <button data-number="7" aria-label="7"></button>
            <button data-number="8" aria-label="8"></button>
            <button data-number="9" aria-label="9"></button>
        </div>

        <!-- Real Enter button -->
        <button class="enter-button" id="enterButton">
            <span class="sr-only">Enter password</span>
        </button>

        <p class="message" id="message"></p>

    </main>

    <script src="script.js"></script>
</body>
</html>
